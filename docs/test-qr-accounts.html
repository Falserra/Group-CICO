<!doctype html>
<html lang="en">

<title>CiCo Account QR Codes</title>
<style>
  :root { --ink:#0F2A43; --mute:#6B7C8F; }
  body { margin:0; background:#fff; color:var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .page { max-width: 820px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .lead { color: var(--mute); margin: 0 0 20px; }
  .signs { display:flex; flex-wrap:wrap; gap:24px; justify-content:center; }
  .sign { border:3px solid var(--ink); border-radius:18px; padding:20px; width:100%; max-width:320px; text-align:center; box-sizing:border-box; break-inside:avoid; }
  .sign h2 { margin:0 0 4px; font-size:26px; }
  .sign p { margin:0 0 12px; color:var(--mute); }
  .sign svg { width:100%; max-width:240px; height:auto; display:block; margin:0 auto; }
  .sign .foot { margin-top:12px; font-weight:700; }
</style>
</head>
